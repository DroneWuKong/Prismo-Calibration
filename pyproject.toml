[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismo-calibration"
version = "0.4.0"
description = "Easy sensor calibration for Orqa equipment with optional Prismo integration"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "opencv-python-headless==4.6.0.66"]

[project.scripts]
prismo-calibration = "prismo_calibration.calibration_app:main"
orqa-sensor-cal = "prismo_calibration.calibration_app:main"

[tool.setuptools]
packages = ["prismo_calibration"]
package-dir = {prismo_calibration = "apb/scripts"}

[tool.setuptools.package-data]
prismo_calibration = ["*.html", "*.js", "*.css"]
